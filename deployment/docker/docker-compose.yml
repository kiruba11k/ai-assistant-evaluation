version: "3.9"

services:
  ai-assistant-eval:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: ai-assistant-eval:latest
    container_name: ai-assistant-eval
    ports:
      - "7860:7860"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HF_API_TOKEN=${HF_API_TOKEN}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - DEBUG=${DEBUG:-false}
    volumes:
      # Persist logs and eval results
      - ./data/logs:/app/logs
      - ./data/results:/app/evaluation/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  logs:
  results:
